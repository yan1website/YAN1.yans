<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Drop</title>
  <style>
    :root {
      --ink: #1f2a24;
      --muted: #647067;
      --paper: #f6f7f2;
      --card: #ffffff;
      --line: #dfe6dc;
      --accent: #356b4f;
      --accent-dark: #28523c;
      --soft: #e9f0e6;
      --danger: #a83e3e;
      --shadow: 0 24px 70px rgba(31, 52, 37, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(211, 231, 211, 0.7), transparent 34%),
        radial-gradient(circle at 96% 100%, rgba(237, 220, 186, 0.55), transparent 31%),
        var(--paper);
      font-family: Georgia, 'Times New Roman', serif;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 62px 0 72px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font: 700 0.75rem/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 5.8rem);
      font-weight: 400;
      line-height: 0.94;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 560px;
      margin: 24px 0 42px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .panel {
      padding: clamp(22px, 5vw, 42px);
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(223, 230, 220, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .drop-zone {
      display: grid;
      min-height: 220px;
      padding: 28px;
      place-items: center;
      text-align: center;
      cursor: pointer;
      background: var(--soft);
      border: 1.5px dashed #a9c1aa;
      border-radius: 6px;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .drop-zone:hover, .drop-zone.dragging {
      background: #dfebdd;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.45rem;
      font-weight: 400;
    }

    .drop-zone span { color: var(--muted); font: 0.85rem/1.5 Arial, sans-serif; }
    input[type="file"] { display: none; }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0 0;
    }

    .preview-grid:empty { display: none; }

    .preview-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: #eef2ec;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .preview-card img { width: 100%; height: 100%; display: block; object-fit: contain; }

    .preview-card span {
      position: absolute;
      right: 7px;
      bottom: 7px;
      padding: 4px 6px;
      color: #fff;
      background: rgba(31, 42, 36, 0.78);
      border-radius: 3px;
      font: 700 0.67rem Arial, sans-serif;
    }

    .file-name {
      min-height: 24px;
      margin: 15px 0 26px;
      color: var(--accent-dark);
      font: 600 0.88rem/1.5 Arial, sans-serif;
      overflow-wrap: anywhere;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    select, .result-input {
      width: 100%;
      padding: 14px 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      font: 1rem Arial, sans-serif;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font: 700 0.85rem Arial, sans-serif;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.6; }

    .status {
      min-height: 25px;
      margin: 18px 0 0;
      color: var(--muted);
      font: 0.9rem/1.5 Arial, sans-serif;
    }

    .status.error { color: var(--danger); }

    .results {
      display: none;
      margin-top: 34px;
      padding-top: 30px;
      border-top: 1px solid var(--line);
    }

    .results.visible { display: block; animation: rise 300ms ease both; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    h2 { margin: 0 0 20px; font-size: 1.8rem; font-weight: 400; }

    .result-group { margin: 0 0 16px; }
    .result-group label { color: var(--muted); font-size: 0.7rem; }
    .result-line { display: flex; gap: 8px; }
    .result-input { min-width: 0; font-size: 0.82rem; }
    .copy-button { width: auto; min-width: 92px; padding: 10px; }

    .save-button { margin-top: 12px; background: #b77b36; }
    .save-button:hover:not(:disabled) { background: #946027; }

    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font: 0.75rem/1.5 Arial, sans-serif;
    }

    @media (max-width: 560px) {
      main { width: min(100% - 24px, 760px); padding-top: 36px; }
      .field-row { grid-template-columns: 1fr; }
      .preview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .result-line { display: grid; grid-template-columns: 1fr auto; }
      .copy-button { min-width: 78px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Private image utility</p>
    <h1>Drop an image.<br>Keep it temporary.</h1>
    <p class="intro">Upload an image, choose when it should disappear, and get both links ready to save.</p>

    <section class="panel" aria-label="Image uploader">
      <form id="uploadForm">
        <label class="drop-zone" id="dropZone" for="imageFile">
          <span>
            <strong id="dropTitle">Choose up to 3 images</strong>
            <span>Click here or drag image files into this area</span>
          </span>
          <input id="imageFile" type="file" accept="image/*" multiple>
        </label>
        <div class="preview-grid" id="previewGrid" aria-label="Selected image previews"></div>
        <p class="file-name" id="fileName" aria-live="polite"></p>

        <div class="field-row">
          <div>
            <label for="deleteAfter">Delete after</label>
            <select id="deleteAfter" name="deleteAfter">
              <option value="86400" data-form-value="24" selected>24 hours</option>
              <option value="3600" data-form-value="1">1 hour</option>
              <option value="259200" data-form-value="72">3 days</option>
              <option value="604800" data-form-value="168">7 days</option>
              <option value="2592000" data-form-value="720">30 days</option>
            </select>
          </div>
          <div>
            <label for="fileType">Accepted files</label>
            <select id="fileType" disabled aria-label="Accepted file types">
              <option>JPG, PNG, GIF, WebP</option>
            </select>
          </div>
        </div>

        <button id="uploadButton" type="submit">Upload selected images</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <section class="results" id="results" aria-live="polite">
        <h2>Your links are ready</h2>
        <div class="result-group">
          <label for="imageUrl">Image URL</label>
          <div class="result-line">
            <input class="result-input" id="imageUrl" readonly>
            <button class="copy-button" type="button" data-copy="imageUrl">Copy</button>
          </div>
        </div>
        <div class="result-group">
          <label for="deleteUrl">Deletion URL</label>
          <div class="result-line">
            <input class="result-input" id="deleteUrl" readonly>
            <button class="copy-button" type="button" data-copy="deleteUrl">Copy</button>
          </div>
        </div>
        <button class="save-button" id="saveButton" type="button">Save links to form</button>
        <p class="note">This opens the Google Form in the same tab with the image URL and deletion time prefilled.</p>
      </section>
    </section>
  </main>

  <script>
    const API_KEY = '99fd13f041920cf0cd835e1ff0e1652e';
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSf9CUV0rV_DLiCBHfS4kLfsdCjEG2hVItfedH3TdefHeSqYSw/viewform?usp=pp_url';
    const IMAGE_ENTRY = 'entry.1209964627';
    const DELETE_AFTER_ENTRY = 'entry.382601663';

    const form = document.querySelector('#uploadForm');
    const fileInput = document.querySelector('#imageFile');
    const dropZone = document.querySelector('#dropZone');
    const previewGrid = document.querySelector('#previewGrid');
    const fileName = document.querySelector('#fileName');
    const dropTitle = document.querySelector('#dropTitle');
    const uploadButton = document.querySelector('#uploadButton');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const imageUrl = document.querySelector('#imageUrl');
    const deleteUrl = document.querySelector('#deleteUrl');
    const saveButton = document.querySelector('#saveButton');
    let selectedFiles = [];

    function getImageFiles(fileList) {
      const files = [...fileList];
      if (files.length < 1 || files.length > 3 || files.some((file) => !file.type.startsWith('image/'))) {
        fileInput.value = '';
        previewGrid.replaceChildren();
        fileName.textContent = 'Choose between one and three image files.';
        status.textContent = 'Only 1 to 3 image files are allowed.';
        status.className = 'status error';
        return null;
      }
      return files;
    }

    function showPreviews(files) {
      previewGrid.replaceChildren();
      files.forEach((file, index) => {
        const card = document.createElement('div');
        const image = document.createElement('img');
        const number = document.createElement('span');
        image.src = URL.createObjectURL(file);
        image.alt = `Selected image ${index + 1}`;
        number.textContent = `Image ${index + 1}`;
        card.className = 'preview-card';
        card.append(image, number);
        previewGrid.append(card);
      });
      fileName.textContent = `${files.length} image${files.length === 1 ? '' : 's'} selected`;
      dropTitle.textContent = 'Choose different images';
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Could not read ${file.name}.`));
        image.src = URL.createObjectURL(file);
      });
    }

    async function combineImages(files) {
      const images = await Promise.all(files.map(loadImage));
      const separatorWidth = 20;
      const canvas = document.createElement('canvas');
      canvas.width = images.reduce((total, image) => total + image.naturalWidth, 0) + separatorWidth * (images.length - 1);
      canvas.height = Math.max(...images.map((image) => image.naturalHeight));
      const context = canvas.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      let x = 0;
      images.forEach((image) => {
        context.drawImage(image, x, 0);
        x += image.naturalWidth + separatorWidth;
      });
      return new Promise((resolve, reject) => canvas.toBlob((blob) => {
        if (blob) resolve(new File([blob], 'combined-images.png', { type: 'image/png' }));
        else reject(new Error('Could not combine the selected images.'));
      }, 'image/png'));
    }

    async function uploadFiles(files) {
      status.textContent = files.length === 1 ? 'Uploading image...' : `Combining ${files.length} images with a 20px separator...`;
      status.className = 'status';
      results.classList.remove('visible');
      try {
        const fileToUpload = files.length === 1 ? files[0] : await combineImages(files);
        const body = new FormData();
        body.append('image', fileToUpload);
        body.append('expiration', document.querySelector('#deleteAfter').value);
        status.textContent = 'Uploading securely...';
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, { method: 'POST', body });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error?.message || 'The image could not be uploaded.');
        imageUrl.value = data.data.url;
        deleteUrl.value = data.data.delete_url;
        storeUploadData(data.data.url, data.data.delete_url);
        results.classList.add('visible');
        status.textContent = 'Upload complete.';
      } catch (error) {
        status.textContent = error.message;
        status.className = 'status error';
      }
    }

    function storeUploadData(uploadedImageUrl, uploadedDeleteUrl) {
      if (!window.InternalData) return;
      const deleteAfter = document.querySelector('#deleteAfter').selectedOptions[0].dataset.formValue;
      window.InternalData.put('image_url', uploadedImageUrl);
      window.InternalData.put('delete_url', uploadedDeleteUrl);
      window.InternalData.put('delete_after', deleteAfter);
      window.InternalData.setPolicy('allow');
    }

    function selectFiles(fileList) {
      const files = getImageFiles(fileList);
      if (!files) return;
      selectedFiles = files;
      showPreviews(files);
      status.textContent = 'Ready to upload.';
      status.className = 'status';
    }

    fileInput.addEventListener('change', () => selectFiles(fileInput.files));
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!selectedFiles.length) {
        status.textContent = 'Choose at least one image first.';
        status.className = 'status error';
        return;
      }
      uploadButton.disabled = true;
      uploadButton.textContent = 'Uploading...';
      await uploadFiles(selectedFiles);
      uploadButton.disabled = false;
      uploadButton.textContent = 'Upload selected images';
    });
    ['dragenter', 'dragover'].forEach((eventName) => dropZone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropZone.classList.add('dragging');
    }));
    ['dragleave', 'drop'].forEach((eventName) => dropZone.addEventListener(eventName, (event) => {
      event.preventDefault();
      dropZone.classList.remove('dragging');
    }));
    dropZone.addEventListener('drop', (event) => {
      if (event.dataTransfer.files.length) {
        fileInput.files = event.dataTransfer.files;
        selectFiles(event.dataTransfer.files);
      }
    });

    document.querySelectorAll('[data-copy]').forEach((button) => button.addEventListener('click', async () => {
      const input = document.querySelector(`#${button.dataset.copy}`);
      await navigator.clipboard.writeText(input.value);
      const oldText = button.textContent;
      button.textContent = 'Copied';
      setTimeout(() => { button.textContent = oldText; }, 1400);
    }));

    saveButton.addEventListener('click', () => {
      const deleteAfter = document.querySelector('#deleteAfter').selectedOptions[0].dataset.formValue;
      const params = new URLSearchParams({
        usp: 'pp_url',
        [IMAGE_ENTRY]: imageUrl.value,
        [DELETE_AFTER_ENTRY]: deleteAfter
      });
      window.location.href = `${FORM_URL.split('?')[0]}?${params.toString()}`;
    });
  </script>
</body>
</html>
